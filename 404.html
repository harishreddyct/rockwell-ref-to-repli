<!DOCTYPE html>
<html lang="en">
<head>
  <title>Page Not Found</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles/styles.css">
  <link rel="stylesheet" href="/styles/fonts.css">
  <link rel="stylesheet" href="/404.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&display=swap">
  <script type="module">
    import { sampleRUM } from '/scripts/aem.js';
    sampleRUM();
    window.addEventListener('load', () => {
      if (document.referrer) {
        const backLink = document.querySelector('.error-back');
        if (backLink) backLink.classList.remove('hidden');
      }
    });
  </script>
</head>
<body class="appear">
  <header></header>
  <main>
    <div class="section error-section">
      <div>
        <h1>Page Not Found</h1>
        <p>The page you were looking for could not be found. It may have moved, or the address may be incorrect.</p>
        <p><a href="/" class="button">Return to Home</a></p>
        <p class="error-back hidden"><a href="javascript:history.back()">Go back to the previous page</a></p>
      </div>
    </div>
  </main>
  <footer></footer>
  <script type="module" src="/scripts/scripts.js"></script>
</body>
</html>
